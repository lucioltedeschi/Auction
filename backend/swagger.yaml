openapi: 3.0.3

info:
  title: API Auct.io - Sistema de Subastas
  version: 3.0.0
  description: >
    API REST para registro KYC en dos pasos, medios de pago, catalogos,
    pujas en tiempo real (SSE), consignacion de articulos e integracion de
    estado en vivo. Todos los endpoints protegidos requieren Bearer token
    obtenido en /api/auth/login.

servers:
  - url: http://localhost:3000
    description: Servidor local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registro y login
  - name: Usuarios
    description: Perfil, historial y compras
  - name: Subastas
    description: Listado, detalle, catalogo y tiempo real
  - name: Pujas
    description: Crear y consultar pujas
  - name: Medios de pago
    description: Gestion de medios de pago del cliente
  - name: Consignacion
    description: Solicitud y seguimiento de consignaciones
  - name: Admin
    description: Operaciones internas de empleados

paths:

  # ── Health ───────────────────────────────────────────────────────────────────

  /api/test:
    get:
      tags: [Auth]
      summary: Verificar conexion con la base
      security: []
      responses:
        "200":
          description: API conectada

  # ── Auth ─────────────────────────────────────────────────────────────────────

  /api/auth/registro/paso1:
    post:
      tags: [Auth]
      summary: Registro KYC paso 1 — datos personales y DNI
      description: >
        El usuario carga datos personales y fotos del DNI. Queda en estado
        pendiente hasta que un empleado apruebe su identidad.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroPaso1"
      responses:
        "201":
          description: Solicitud creada, pendiente de verificacion
        "400":
          description: Faltan datos obligatorios
        "409":
          description: Documento ya registrado

  /api/auth/registro/paso2:
    post:
      tags: [Auth]
      summary: Registro KYC paso 2 — generar clave
      description: >
        Solo disponible cuando un admin aprobo al usuario y le asigno categoria.
        El usuario elige su contrasena y la cuenta queda activa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento, clave]
              properties:
                documento: { type: string, example: "30123456" }
                clave: { type: string, format: password, example: "Clave1234" }
      responses:
        "200":
          description: Clave generada, cuenta activa
        "403":
          description: Cuenta pendiente de verificacion
        "404":
          description: Usuario no encontrado

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento, clave]
              properties:
                documento: { type: string, example: "30123456" }
                clave: { type: string, example: "1234" }
      responses:
        "200":
          description: Login correcto — devuelve token Bearer y datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  userId: { type: integer }
                  esAdmin: { type: boolean }
        "401":
          description: Credenciales incorrectas
        "403":
          description: Usuario no activo o no admitido

  # ── Usuarios ─────────────────────────────────────────────────────────────────

  /api/users/{userId}:
    get:
      tags: [Usuarios]
      summary: Consultar perfil de usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Perfil obtenido
        "404":
          description: Usuario no encontrado
    patch:
      tags: [Usuarios]
      summary: Actualizar perfil de usuario
      description: Permite editar email, telefono y direccion.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: "nuevo@mail.com" }
                telefono: { type: string, example: "1155551234" }
                direccion: { type: string, example: "Av. Santa Fe 1234, CABA" }
      responses:
        "200":
          description: Perfil actualizado
        "404":
          description: Usuario no encontrado

  /api/clients/{clientId}/history:
    get:
      tags: [Usuarios]
      summary: Historial de participacion en subastas
      description: >
        Devuelve las subastas en las que el cliente pujo, con totalPujas,
        itemsGanados y estado (en_curso / cerrada).
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Listado de subastas con metricas de participacion

  /api/clients/{clientId}/purchases:
    get:
      tags: [Usuarios]
      summary: Compras adjudicadas del cliente
      description: >
        Devuelve los lotes ganados con precio final, estado de pago y
        fecha limite de pago (fechaVenta + 7 dias).
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Compras adjudicadas

  # ── Subastas ─────────────────────────────────────────────────────────────────

  /api/auctions:
    get:
      tags: [Subastas]
      summary: Listar subastas disponibles
      description: Devuelve subastas en estado abierta o programada.
      security: []
      responses:
        "200":
          description: Subastas registradas

  /api/clients/{clientId}/auctions:
    get:
      tags: [Subastas]
      summary: Subastas disponibles con acceso del cliente
      description: >
        Igual que /api/auctions pero enriquecido con puedeVer, puedePujar
        y motivoBloqueo segun categoria, medios verificados y multas pendientes.
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Subastas con estado de acceso del cliente

  /api/auctions/{auctionId}:
    get:
      tags: [Subastas]
      summary: Detalle de una subasta
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      responses:
        "200":
          description: Datos de la subasta
        "404":
          description: Subasta no encontrada

  /api/auctions/{auctionId}/catalog:
    get:
      tags: [Subastas]
      summary: Catalogo completo de una subasta
      description: >
        Devuelve todos los items con precio base, comision, artista,
        historia y mejor oferta actual.
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      responses:
        "200":
          description: Items del catalogo

  /api/auctions/{auctionId}/live-state:
    get:
      tags: [Subastas]
      summary: Estado en vivo de la subasta (snapshot)
      description: >
        Devuelve el item actual en subasta, mejor oferta, limites de puja,
        segundosRestantes, duracionItemMinutos y URL del canal SSE.
        El timer se calcula desde la ultima puja, o desde el horario
        programado de la subasta si aun no hay pujas.
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      responses:
        "200":
          description: Estado en vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  subastaId: { type: integer }
                  estado: { type: string, enum: [en_curso, programada, cerrada] }
                  duracionItemMinutos: { type: integer, example: 3 }
                  segundosRestantes: { type: integer, example: 142 }
                  mejorOferta: { type: number }
                  pujaMinima: { type: number }
                  pujaMaxima: { type: number, nullable: true }
                  eventosUrl: { type: string }
                  itemActual:
                    type: object
                    properties:
                      itemId: { type: integer }
                      descripcionCatalogo: { type: string }
                      precioBase: { type: number }
                      comision: { type: number }
        "404":
          description: Sin item activo en esta subasta

  /api/auctions/{auctionId}/events:
    get:
      tags: [Subastas]
      summary: Stream SSE de actualizaciones en tiempo real
      description: >
        Publica eventos live-state cada 5 segundos. Auto-inicia subastas
        programadas cuando llega su hora y cierra items cuando expira el timer.
        Formato de respuesta: text/event-stream (conexion persistente).
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      responses:
        "200":
          description: Stream text/event-stream

  # ── Pujas ─────────────────────────────────────────────────────────────────────

  /api/auctions/{auctionId}/items/{itemId}/bids:
    post:
      tags: [Pujas]
      summary: Crear puja sobre un item de una subasta
      description: >
        Valida: usuario activo y admitido, categoria suficiente, medio de pago
        verificado, sin multas pendientes, item no vendido. Reglas de monto:
        minimo precio_base + 1%, maximo precio_base + 20% (sin limite para oro y platino).
      parameters:
        - $ref: "#/components/parameters/AuctionId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, importe]
              properties:
                clienteId: { type: integer, example: 1 }
                importe: { type: number, format: double, example: 12300 }
      responses:
        "201":
          description: Puja registrada
        "400":
          description: Monto fuera de las reglas permitidas
        "403":
          description: Cliente no habilitado para pujar
        "409":
          description: Item ya vendido

  /api/bids:
    post:
      tags: [Pujas]
      summary: Crear puja (ruta alternativa compatible con Android)
      description: Misma logica que la ruta anidada. Acepta subastaId en el body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, subastaId, itemId, importe]
              properties:
                clienteId: { type: integer, example: 1 }
                subastaId: { type: integer, example: 1 }
                itemId: { type: integer, example: 1 }
                importe: { type: number, format: double, example: 12300 }
      responses:
        "201":
          description: Puja registrada

  /api/catalog-items/{itemId}/bids:
    get:
      tags: [Pujas]
      summary: Historial de pujas de un item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Pujas ordenadas por fecha descendente

  /api/catalog-items/{itemId}/best-bid:
    get:
      tags: [Pujas]
      summary: Mejor oferta actual de un item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Importe y cliente de la mejor oferta
          content:
            application/json:
              schema:
                type: object
                properties:
                  importe: { type: number, nullable: true }
                  clienteId: { type: integer, nullable: true }
        "404":
          description: Item no encontrado

  # ── Medios de pago ────────────────────────────────────────────────────────────

  /api/clients/{clientId}/payment-methods:
    get:
      tags: [Medios de pago]
      summary: Listar medios de pago del cliente
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Medios de pago con estado de verificacion
    post:
      tags: [Medios de pago]
      summary: Agregar medio de pago
      description: >
        Acepta cuenta bancaria, tarjeta de credito o cheque certificado.
        Queda pendiente de verificacion por un empleado.
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedioPago"
      responses:
        "201":
          description: Medio de pago creado, pendiente de verificacion
        "400":
          description: Datos invalidos

  /api/clients/{clientId}/payment-methods/{paymentMethodId}:
    patch:
      tags: [Medios de pago]
      summary: Editar medio de pago existente
      description: >
        Permite actualizar campos del medio de pago. Vuelve a estado
        pendiente de verificacion tras la edicion.
      parameters:
        - $ref: "#/components/parameters/ClientId"
        - name: paymentMethodId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedioPago"
      responses:
        "200":
          description: Medio de pago actualizado
        "404":
          description: Medio de pago no encontrado

  # ── Consignacion ──────────────────────────────────────────────────────────────

  /api/products:
    post:
      tags: [Consignacion]
      summary: Solicitar consignacion de articulo
      description: >
        Requiere declaracion de propiedad, origen licito y minimo 6 fotos en base64.
        Opcionalmente el cliente puede indicar una subasta destino preferida (subastaId).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Consignacion"
      responses:
        "202":
          description: Solicitud enviada a revision
        "400":
          description: Faltan datos o fotos insuficientes

  /api/clients/{clientId}/products:
    get:
      tags: [Consignacion]
      summary: Seguimiento de consignaciones del cliente
      description: Devuelve estado (pendiente / aceptado / rechazado) y subasta preferida de cada solicitud.
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Consignaciones propias

  /api/products/{productId}/photos:
    get:
      tags: [Consignacion]
      summary: Fotos de un producto consignado
      description: Devuelve las fotos en base64 para mostrar imagenes reales en el catalogo.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Fotos del producto

  # ── Admin ─────────────────────────────────────────────────────────────────────

  /api/admin/users/pending:
    get:
      tags: [Admin]
      summary: Listar usuarios pendientes de verificacion
      responses:
        "200":
          description: Usuarios pendientes con fotos DNI en base64

  /api/admin/users/{userId}/verification:
    patch:
      tags: [Admin]
      summary: Aprobar o rechazar usuario y asignar categoria
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admitido, categoria]
              properties:
                admitido: { type: string, enum: [si, no], example: "si" }
                categoria:
                  type: string
                  enum: [comun, especial, plata, oro, platino]
                  example: "plata"
      responses:
        "200":
          description: Verificacion actualizada
        "404":
          description: Usuario no encontrado

  /api/admin/payment-methods/pending:
    get:
      tags: [Admin]
      summary: Listar medios de pago pendientes de verificacion
      responses:
        "200":
          description: Medios pendientes

  /api/admin/payment-methods/{paymentMethodId}/verification:
    patch:
      tags: [Admin]
      summary: Verificar o rechazar medio de pago
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificado]
              properties:
                verificado: { type: string, enum: [si, no], example: "si" }
                rechazado: { type: string, enum: [si, no], nullable: true }
                motivoRechazo: { type: string, nullable: true }
      responses:
        "200":
          description: Verificacion actualizada

  /api/admin/products/pending:
    get:
      tags: [Admin]
      summary: Listar consignaciones pendientes de revision
      description: Incluye subasta preferida del consignante (subastaPreferida, subastaUbicacion, subastaFecha).
      responses:
        "200":
          description: Productos pendientes con info de subasta preferida

  /api/admin/products/{productId}/review:
    patch:
      tags: [Admin]
      summary: Revisar consignacion — aceptar o rechazar
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoAprobacion]
              properties:
                estadoAprobacion:
                  type: string
                  enum: [aceptado, rechazado]
                  example: "aceptado"
                motivoRechazo: { type: string, nullable: true }
                ubicacionDeposito: { type: string, nullable: true, example: "Deposito A - Estante 3" }
                seguro: { type: string, nullable: true, example: "POL-ALE-001" }
      responses:
        "200":
          description: Revision actualizada

  /api/admin/auctions/{auctionId}/items:
    post:
      tags: [Admin]
      summary: Asignar producto aceptado a una subasta (crear item de catalogo)
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, precioBase, comision]
              properties:
                productId: { type: integer, example: 3 }
                precioBase: { type: number, example: 10000 }
                comision: { type: number, example: 1200 }
      responses:
        "201":
          description: Item de catalogo creado
        "400":
          description: Datos invalidos o producto no aceptado

  /api/admin/auctions/{auctionId}/duracion:
    patch:
      tags: [Admin]
      summary: Cambiar la duracion del timer por item en una subasta
      description: >
        Actualiza duracionItemMinutos (1 a 60). El nuevo valor se aplica
        en el siguiente ciclo SSE. Default al crear la subasta: 3 minutos.
      parameters:
        - $ref: "#/components/parameters/AuctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutos]
              properties:
                minutos:
                  type: integer
                  minimum: 1
                  maximum: 60
                  example: 5
      responses:
        "200":
          description: Duracion actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duracionItemMinutos: { type: integer }
        "400":
          description: Valor fuera de rango (debe ser entre 1 y 60)
        "404":
          description: Subasta no encontrada

# ── Components ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en /api/auth/login. Implementacion demo en base64 JSON, no JWT real.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: integer }
    AuctionId:
      name: auctionId
      in: path
      required: true
      schema: { type: integer }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer }

  schemas:
    RegistroPaso1:
      type: object
      required: [documento, nombre, apellido, direccion, fotoDniFrente, fotoDniDorso]
      properties:
        documento: { type: string, example: "35123456" }
        nombre: { type: string, example: "Monica" }
        apellido: { type: string, example: "Perez" }
        email: { type: string, nullable: true, example: "monica@test.com" }
        telefono: { type: string, nullable: true, example: "1155559999" }
        direccion: { type: string, example: "Av. Cabildo 1234, CABA" }
        fotoDniFrente: { type: string, format: byte, description: "Foto frontal del DNI en base64" }
        fotoDniDorso: { type: string, format: byte, description: "Foto dorso del DNI en base64" }

    MedioPago:
      type: object
      required: [tipo, entidad, numeroReferencia]
      properties:
        tipo:
          type: string
          enum: [cuenta_bancaria, tarjeta_credito, cheque_certificado]
          example: "tarjeta_credito"
        entidad: { type: string, example: "Visa" }
        numeroReferencia: { type: string, example: "**** **** **** 1234" }
        esExtranjera: { type: string, enum: [si, no], example: "no" }
        moneda: { type: string, enum: [pesos, dolares], example: "pesos" }
        montoCheque: { type: number, nullable: true, example: 200000 }

    Consignacion:
      type: object
      required: [duenio, descripcionCatalogo, descripcionCompleta, declaracionPropiedad, origenLicito, fotos]
      properties:
        duenio: { type: integer, example: 1 }
        descripcionCatalogo: { type: string, example: "Reloj antiguo de coleccion" }
        descripcionCompleta: { type: string, example: "Reloj de coleccion en excelente estado" }
        historia: { type: string, nullable: true, example: "Pieza familiar desde 1950" }
        artistaDiseniador: { type: string, nullable: true, example: "Sin identificar" }
        fechaObjeto: { type: string, format: date, nullable: true, example: "1950-01-01" }
        precioBaseSugerido: { type: number, nullable: true, example: 10000 }
        declaracionPropiedad: { type: string, enum: [si], example: "si" }
        origenLicito: { type: string, enum: [si], example: "si" }
        subastaId:
          type: integer
          nullable: true
          example: 2
          description: ID de subasta destino preferida por el consignante (opcional)
        fotos:
          type: array
          minItems: 6
          items:
            type: string
            format: byte
          description: Minimo 6 fotos del articulo en base64
